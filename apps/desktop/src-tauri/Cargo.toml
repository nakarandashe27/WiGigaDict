[package]
name = "wigigadict-desktop"
version = "0.0.3"
description = "WiGigaDict local Windows shell"
authors = ["WiGigaDict"]
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "wigigadict_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Tauri decides dev vs production by this feature, not by the cargo profile: without it even a
# --release binary loads build.devUrl (127.0.0.1:1420) instead of the embedded frontend. Default
# it so a plain `cargo build --release` produces a working binary; `tauri dev` disables defaults.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
cpal = "=0.18.2"
crossbeam-channel = "=0.5.16"
rubato = "=5.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.3.2"
thiserror = "2.0.17"
uuid = { version = "=1.24.1", features = ["v4"] }
wigigadict-protocol = { version = "=0.0.1", path = "../../../crates/protocol" }
wigigadict-storage = { version = "0.0.1", path = "../../../crates/storage" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
