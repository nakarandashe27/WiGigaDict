[package]
name = "wigigadict-asr-sidecar"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

[features]
fixture-engine = []

[[bin]]
name = "wigigadict-asr-fixture-worker"
path = "src/bin/asr-fixture-worker.rs"
required-features = ["fixture-engine"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "=0.10.9"
wigigadict-protocol = { version = "=0.0.1", path = "../protocol" }
